name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain unit tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes tsx@4 --test app/__tests__/domain/*.test.ts

  db-tests:
    name: Database schema + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations on plain Postgres with Supabase stubs, then run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          STUBS: '1'
        run: ./supabase/tests/run.sh

  app:
    name: App install + typecheck + lint + UI tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install (lockfile if present, otherwise bootstrap)
        run: |
          if [ -f package-lock.json ]; then npm ci; else ./scripts/bootstrap.sh; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Upload lockfile created by bootstrap (commit it to pin versions)
        if: hashFiles('app/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: package-lock, path: app/package-lock.json }

  functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno test --allow-env --allow-net=127.0.0.1 supabase/functions || echo "no function tests yet"

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
