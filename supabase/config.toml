# Local development config for the Supabase CLI.
# Hosted project settings (Apple provider keys, SMTP) are set in the dashboard.
project_id = "glovebox"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "glovebox://"
additional_redirect_urls = ["glovebox://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# T101 (FR-001): the app signs in with the 6-digit code, so both emails show {{ .Token }} and no link.
# Local only. Paste the same files into the hosted project (quickstart.md §3).
[auth.email.template.confirmation]
subject = "Your Glovebox sign-up code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Glovebox sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_SERVICES_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

# All functions share supabase/functions/deno.json (import map + test task).
[functions.delete-account]
import_map = "./functions/deno.json"

[functions.export-data]
import_map = "./functions/deno.json"

[functions.extract-receipt]
import_map = "./functions/deno.json"

[functions.public-report]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.storage-sweep]
# Called by pg_cron with the SWEEP_SECRET header, not a user JWT (supabase/cron/storage-sweep.sql).
verify_jwt = false
import_map = "./functions/deno.json"

[functions.revenuecat-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
